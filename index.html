<!DOCTYPE html>
<html>
<head>
    <title>Student Details</title>
    <style>

    body {
        font-family: Arial;
        text-align: center;
        background-color: #f2f2f2;
    }

    input {
        padding: 10px;
        width: 250px;
    }

    button {
        padding: 10px 20px;
        cursor: pointer;
    }

    #studentContainer {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
    }

    #studentContainer div {
        background-color: white;
        width: 220px;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 8px gray;
        text-align: left;
    }

</style>
</head>

<body>

    <h1>Student Details</h1>

    <input type="text" id="name" placeholder="Enter Name">
    <br><br>

    <input type="text" id="roll" placeholder="Enter Roll Number">
    <br><br>

    <input type="text" id="course" placeholder="Enter Course">
    <br><br>

    <input type="text" id="semester" placeholder="Enter Semester">
    <br><br>

    <button onclick="addStudent()">Add Student</button>

    <div id="studentContainer"></div>
    <script>

    let students = [];

    function addStudent() {
        if (students.length >= 5) {
    alert("Only 5 students can be added.");
    return;
}

        let name = document.getElementById("name").value;
        let roll = document.getElementById("roll").value;
        let course = document.getElementById("course").value;
        let semester = document.getElementById("semester").value;

        let student = {
            name: name,
            roll: roll,
            course: course,
            semester: semester
        };

        students.push(student);

        displayStudents();
    }

    function displayStudents() {

        let container = document.getElementById("studentContainer");

        container.innerHTML = "";

        students.forEach(function(student, index) {

            container.innerHTML += `
                <div>
                    <h3>Student ${index + 1}</h3>
                    <p>Name: ${student.name}</p>
                    <p>Roll No: ${student.roll}</p>
                    <p>Course: ${student.course}</p>
                    <p>Semester: ${student.semester}</p>
                </div>
            `;

        });
    }

</script>

</body>
</html>
